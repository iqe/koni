# Koni configuration file
#
# This file uses TOML syntax (https://github.com/toml-lang/toml)
#
# All commented values are optional, the defaults are shown here.
# Unknown settings are rejected.

# Enable debug logging of request/response
#debug = false

# IP and port koni should listen on. Use e.g. ":443" to listen on a port on all IPs
#listen_http = "127.0.0.1:4080"
#listen_https = "127.0.0.1:4443"

[letsencrypt]
# URL of Let's Encrypt service to use. By default, koni uses the staging URL,
# whose certificates are NOT trusted by clients. Use the production URL in production.
#url = "https://acme-v02.api.letsencrypt.org/directory"
#url = "https://acme-staging-v02.api.letsencrypt.org/directory"

# Optional contact email for the Let's Encrypt account
#email = "koni@example.com"

# Cache directory for certificates. Must be writable by koni.
#certs_dir = "."

[mail]
# Provider id used in autoconfig.xml - should be a valid DNS name
provider_id = "example.com"

# SMTP, IMAP and POP3 servers
smtp_server = "smtp.example.com"
imap_server = "imap.example.com"
pop3_server = "pop.example.com"
